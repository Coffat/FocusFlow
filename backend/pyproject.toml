[project]
name = "focusflow-backend"
version = "0.1.0"
description = "FocusFlow Backend — Adaptive Self-Directed Learning Operating System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "uuid6>=2024.7.10",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "google-genai>=0.1.1",
    "icalendar>=6.1.0",
    "python-multipart>=0.0.18",
    "httpx>=0.28.0",
    "email-validator>=2.3.0",
    "aiosmtplib>=5.1.3",
    "google-auth>=2.61.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

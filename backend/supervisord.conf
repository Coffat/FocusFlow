[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:backend]
command=uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=taskiq worker src.shared_kernel.infrastructure.worker.broker:broker src.shared_kernel.infrastructure.outbox.relay src.account.presentation.tasks src.planning.presentation.tasks src.execution.presentation.tasks src.evaluation.presentation.tasks --workers 2
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=taskiq scheduler src.shared_kernel.infrastructure.worker.broker:scheduler src.shared_kernel.infrastructure.outbox.relay src.account.presentation.tasks src.planning.presentation.tasks src.execution.presentation.tasks src.evaluation.presentation.tasks
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

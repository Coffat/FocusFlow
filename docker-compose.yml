services:
  postgres:
    image: postgres:16-alpine
    container_name: focusflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-focusflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-focusflow_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-focusflow_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-focusflow_user} -d ${POSTGRES_DB:-focusflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - focusflow-network

  redis:
    image: redis:7-alpine
    container_name: focusflow-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - focusflow-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: focusflow-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./backend/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
      - ./backend/entrypoint.sh:/usr/local/bin/entrypoint.sh
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-focusflow_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-focusflow_secure_password}
      - POSTGRES_DB=${POSTGRES_DB:-focusflow_db}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-focusflow_user}:${POSTGRES_PASSWORD:-focusflow_secure_password}@postgres:5432/${POSTGRES_DB:-focusflow_db}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-focusflow_user}:${POSTGRES_PASSWORD:-focusflow_secure_password}@postgres:5432/${POSTGRES_DB:-focusflow_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change_this_to_a_super_secret_64_character_hex_key_for_jwt_signing}
      - FERNET_KEY=${FERNET_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_MODEL=${LLM_MODEL:-gemini-3.8-flash}
      - LLM_API_KEY=${LLM_API_KEY:-${GEMINI_API_KEY:-mock-key}}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-mock}
      - CALENDAR_PROVIDER=${CALENDAR_PROVIDER:-google}
      - CALENDAR_ENCRYPTION_KEY=${CALENDAR_ENCRYPTION_KEY:-hOS_brn4ckcgaKn4-wP1cQ048RRb21roVkYFG5PmfhU=}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-227549369009-v57ekq00ntij7ni9or1k6k30mani1ojt.apps.googleusercontent.com}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/v1/account/calendar/google/callback}
      - CALENDAR_WEBHOOK_BASE_URL=${CALENDAR_WEBHOOK_BASE_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - focusflow-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: focusflow-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - backend
    networks:
      - focusflow-network

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local

networks:
  focusflow-network:
    driver: bridge

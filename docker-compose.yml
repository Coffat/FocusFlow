services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: focusflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-focusflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-focusflow_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-focusflow_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-focusflow_user} -d ${POSTGRES_DB:-focusflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - focusflow-network

  redis:
    image: redis:7-alpine
    container_name: focusflow-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - focusflow-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: focusflow-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - focusflow-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: focusflow-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./backend/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
      - ./backend/entrypoint.sh:/usr/local/bin/entrypoint.sh
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-True}
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-focusflow_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-focusflow_secure_password}
      - POSTGRES_DB=${POSTGRES_DB:-focusflow_db}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-focusflow_user}:${POSTGRES_PASSWORD:-focusflow_secure_password}@postgres:5432/${POSTGRES_DB:-focusflow_db}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-focusflow_user}:${POSTGRES_PASSWORD:-focusflow_secure_password}@postgres:5432/${POSTGRES_DB:-focusflow_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change_this_to_a_super_secret_64_character_hex_key_for_jwt_signing}
      - FERNET_KEY=${FERNET_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_THINKING_CONTROL=${LLM_THINKING_CONTROL:-model_suffix}
      - LLM_MODEL=${LLM_MODEL:-gemini-3.8-flash-medium}
      - LLM_MODEL_LOW=${LLM_MODEL_LOW:-gemini-3.8-flash-low}
      - LLM_MODEL_MEDIUM=${LLM_MODEL_MEDIUM:-gemini-3.8-flash-medium}
      - LLM_MODEL_HIGH=${LLM_MODEL_HIGH:-gemini-3.8-flash-high}
      - LLM_EMBEDDING_MODEL=${LLM_EMBEDDING_MODEL:-gemini/gemini-embedding-2}
      - AI_HARD_TIMEOUT_SECONDS=${AI_HARD_TIMEOUT_SECONDS:-55}
      - AI_DECOMPOSER_MAX_CONCURRENCY=${AI_DECOMPOSER_MAX_CONCURRENCY:-4}
      - AI_PROPOSAL_FINALIZE_RESERVE_SECONDS=${AI_PROPOSAL_FINALIZE_RESERVE_SECONDS:-14}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_FALLBACK_MODELS=${LLM_FALLBACK_MODELS:-}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-google_ai_studio}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-gemini/gemini-embedding-2}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-768}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-sepay}
      - CALENDAR_PROVIDER=${CALENDAR_PROVIDER:-google}
      - CALENDAR_ENCRYPTION_KEY=${CALENDAR_ENCRYPTION_KEY:-hOS_brn4ckcgaKn4-wP1cQ048RRb21roVkYFG5PmfhU=}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-227549369009-v57ekq00ntij7ni9or1k6k30mani1ojt.apps.googleusercontent.com}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/v1/account/calendar/google/callback}
      - CALENDAR_WEBHOOK_BASE_URL=${CALENDAR_WEBHOOK_BASE_URL:-http://localhost:3000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - EMAIL_BACKEND=${EMAIL_BACKEND:-smtp}
      - EMAIL_HOST=${EMAIL_HOST:-mailpit}
      - EMAIL_PORT=${EMAIL_PORT:-1025}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASS=${EMAIL_PASS:-}
      - EMAIL_FROM=${EMAIL_FROM:-FocusFlow Support <no-reply@focusflow.local>}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - focusflow-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: focusflow-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - focusflow-network

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local

networks:
  focusflow-network:
    driver: bridge

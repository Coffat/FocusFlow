<div class="dashboard-viewport min-h-full">
  <!-- Page Content Container -->
  <main class="max-w-7xl mx-auto w-full p-4 sm:p-6 lg:p-8 space-y-6 flex-1">
    <!-- State Switcher Toolbar -->
    <app-dashboard-state-switcher
      [activeState]="currentState()"
      (stateChange)="onStateChange($event)"
    />

    <!-- When New User: Render Empty State -->
    @if (currentState() === 'new-user') {
      <app-dashboard-empty-state />
    } @else {
      @if (summary(); as s) {
        <!-- KPI Cards Grid -->
        <app-dashboard-kpi-grid [kpi]="s.kpi" />

        <!-- Weekly Time-Grid -->
        <app-dashboard-weekly-grid
          [scheduleBlocks]="s.scheduleBlocks"
          [currentState]="currentState()"
          [weekOffset]="weekOffset()"
          (weekOffsetChange)="onWeekOffsetChange($event)"
        />

        <!-- Lower Workspace 2-Column Split (Left: Activity & Active Roadmaps; Right: Today Queue & AI Insights) -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
          <!-- Left Column (Span 7) -->
          <div class="lg:col-span-7 space-y-6">
            <app-dashboard-activity-chart [distribution]="s.studyDistribution" />
            <app-dashboard-active-roadmaps [roadmaps]="s.activeRoadmaps" />
          </div>

          <!-- Right Column (Span 5) -->
          <div class="lg:col-span-5 space-y-6">
            <app-dashboard-today-queue [tasks]="s.todayQueue" />
            <app-dashboard-ai-insights
              [insight]="s.aiInsight"
              [adaptation]="s.adaptationStatus"
            />
          </div>
        </div>
      }
    }
  </main>
</div>

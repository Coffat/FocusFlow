<app-auth-card>
  <!-- Brand Header -->
  <app-auth-header
    [title]="'auth.otp.enterCodeTitle' | translate"
    icon="verified_user"
    iconStyle="inline"
    [showLogo]="false"
  />

  <!-- Subtitle Paragraph -->
  <p class="font-sans text-neutral-500 dark:text-secondary text-sm sm:text-[15px] -mt-3 mb-6 text-center leading-relaxed">
    {{ 'auth.otp.dispatchedSubtitle' | translate }}
    <strong class="text-neutral-900 dark:text-on-surface font-medium">{{ email() || ('auth.otp.yourEmail' | translate) }}</strong>.
    {{ 'auth.otp.enterBelowToVerify' | translate }}
    <a routerLink="/sign-up" class="ml-1 text-primary hover:underline underline-offset-4 font-medium text-xs sm:text-sm">
      {{ 'auth.otp.changeEmail' | translate }}
    </a>
  </p>

  <!-- Error Banner -->
  @if (errorMessage()) {
    <app-auth-notice-banner type="error" [message]="errorMessage()" />
  }

  <!-- Success Banner -->
  @if (successMessage()) {
    <app-auth-notice-banner type="success" [message]="successMessage()" />
  }

  <!-- OTP Verification Form -->
  <form (submit)="$event.preventDefault(); verifyOtp()" class="space-y-6">
    <app-otp-input
      [label]="'auth.otp.temporalCodeLabel' | translate"
      [disabled]="isLoading()"
      (codeChange)="onOtpChange($event)"
      (codeCompleted)="onOtpCompleted($event)"
      (resend)="resendOtp()"
    />

    <!-- Primary CTA Capsule Button -->
    <button
      type="submit"
      [disabled]="isLoading() || currentOtp().length !== 6"
      class="w-full h-12 sm:h-[50px] rounded-full bg-[#111111] hover:bg-primary-container text-surface-container-lowest font-sans text-base font-medium tracking-tight transition-colors duration-150 flex items-center justify-center gap-2.5 group shadow-none cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
    >
      <span>{{ isLoading() ? ('auth.otp.verifying' | translate) : ('auth.otp.verifyAndProceed' | translate) }}</span>
      <span class="material-symbols-outlined text-[18px] transition-transform duration-150 group-hover:translate-x-0.5">arrow_forward</span>
    </button>

    <!-- Alternative Links -->
    <div class="pt-2 text-center">
      <div class="flex flex-col sm:flex-row items-center justify-center gap-4 font-sans text-xs">
        <button
          type="button"
          (click)="onUseBackupKey()"
          class="inline-flex items-center gap-1.5 text-secondary hover:text-on-surface hover:underline transition-colors duration-150 cursor-pointer"
        >
          <span class="material-symbols-outlined text-sm">vpn_key</span>
          <span>{{ 'auth.otp.useBackupKey' | translate }}</span>
        </button>
        <span class="hidden sm:inline text-outline-variant">•</span>
        <a routerLink="/sign-in" class="inline-flex items-center gap-1 text-secondary hover:text-on-surface hover:underline transition-colors duration-150">
          <span class="material-symbols-outlined text-sm">arrow_back</span>
          <span>{{ 'auth.otp.backToSignIn' | translate }}</span>
        </a>
      </div>
    </div>
  </form>

  <!-- Cryptographic Session Lock Info Box -->
  <div class="mt-8">
    <app-auth-notice-banner
      type="session-lock"
      [title]="'auth.otp.sessionLockTitle' | translate"
      [message]="'auth.otp.sessionLockText' | translate"
    />
  </div>
</app-auth-card>

<app-auth-card>
  <!-- Brand Header -->
  <app-auth-header
    [title]="'auth.signUp.beginJourney' | translate"
    [subtitle]="'auth.signUp.subtitle' | translate"
    [showLogo]="false"
  />

  <!-- Error Banner -->
  @if (errorMessage()) {
    <app-auth-notice-banner type="error" [message]="errorMessage()" />
  }

  <!-- Info Banner -->
  @if (infoMessage()) {
    <app-auth-notice-banner type="info" [message]="infoMessage()" />
  }

  <!-- Success Banner -->
  @if (successMessage()) {
    <app-auth-notice-banner type="success" [message]="successMessage()" />
  }

  <!-- Social Auth Cluster (Google Only) -->
  <app-social-auth
    [googleButtonText]="'auth.signUp.googleRegister' | translate"
    [dividerText]="'auth.signUp.orRegisterWithEmail' | translate"
    [disabled]="isLoading()"
    (googleClick)="signInWithGoogle()"
  />

  <!-- Registration Form -->
  <form [formGroup]="signUpForm" (ngSubmit)="requestOtp()" class="space-y-5">
    <!-- Full Name Input Group -->
    <app-auth-form-field
      [label]="'auth.signUp.fullNameLabel' | translate"
      forId="fullname"
      prefixIcon="person"
      [errorMessage]="signUpForm.get('fullName')?.touched && signUpForm.get('fullName')?.errors?.['required'] ? ('auth.signUp.fullNameRequiredError' | translate) : ''"
    >
      <input
        id="fullname"
        type="text"
        formControlName="fullName"
        [placeholder]="'auth.signUp.fullNamePlaceholder' | translate"
        autocomplete="name"
        class="w-full h-12 pl-11 pr-4 rounded-xl border border-outline-variant/80 bg-surface-container-lowest text-on-surface placeholder:text-secondary focus:border-on-surface focus:outline-none transition-colors font-sans text-base"
      />
    </app-auth-form-field>

    <!-- Work Email Input Group -->
    <app-auth-form-field
      [label]="'auth.signUp.workEmailLabel' | translate"
      forId="email"
      [hint]="'auth.signUp.institutionalPreferred' | translate"
      prefixIcon="alternate_email"
      [errorMessage]="signUpForm.get('email')?.touched && signUpForm.get('email')?.errors ? (signUpForm.get('email')?.errors?.['required'] ? ('auth.signUp.emailRequiredError' | translate) : ('auth.signUp.emailInvalidError' | translate)) : ''"
    >
      <input
        id="email"
        type="email"
        formControlName="email"
        [placeholder]="'auth.signUp.emailPlaceholder' | translate"
        autocomplete="email"
        class="w-full h-12 pl-11 pr-4 rounded-xl border border-outline-variant/80 bg-surface-container-lowest text-on-surface placeholder:text-secondary focus:border-on-surface focus:outline-none transition-colors font-sans text-base"
      />
    </app-auth-form-field>

    <!-- Password Input Group -->
    <app-auth-form-field
      [label]="'auth.signUp.passwordLabel' | translate"
      forId="password"
      [hint]="'auth.signUp.ruleMinLength' | translate"
      prefixIcon="lock_open"
      [suffixIcon]="isPasswordVisible() ? 'visibility_off' : 'visibility'"
      [showSuffix]="true"
      [suffixAriaLabel]="'auth.signUp.togglePasswordVisibility' | translate"
      (suffixClick)="togglePasswordVisibility()"
      [errorMessage]="signUpForm.get('password')?.touched && signUpForm.get('password')?.errors ? (signUpForm.get('password')?.errors?.['required'] ? ('auth.signUp.passwordRequiredError' | translate) : ('auth.signUp.passwordComplexityError' | translate)) : ''"
    >
      <input
        id="password"
        [type]="isPasswordVisible() ? 'text' : 'password'"
        formControlName="password"
        [placeholder]="'auth.signUp.passwordPlaceholder' | translate"
        autocomplete="new-password"
        class="w-full h-12 pl-11 pr-11 rounded-xl border border-outline-variant/80 bg-surface-container-lowest text-on-surface placeholder:text-secondary focus:border-on-surface focus:outline-none transition-colors font-sans text-base"
      />
    </app-auth-form-field>

    <!-- Password Strength Meter -->
    <app-password-strength-meter
      [strength]="passwordStrength()"
      [securityLabel]="'auth.signUp.securityLevel' | translate"
      [strengthText]="strengthLabelKey() | translate"
    />

    <!-- Confirm Password Input Group -->
    <app-auth-form-field
      [label]="'auth.signUp.confirmPasswordLabel' | translate"
      forId="confirm-password"
      prefixIcon="lock_open"
      [suffixIcon]="isConfirmPasswordVisible() ? 'visibility_off' : 'visibility'"
      [showSuffix]="true"
      [suffixAriaLabel]="'auth.signUp.toggleConfirmPasswordVisibility' | translate"
      (suffixClick)="toggleConfirmPasswordVisibility()"
      [errorMessage]="signUpForm.get('confirmPassword')?.touched ? (signUpForm.get('confirmPassword')?.errors?.['required'] ? ('auth.signUp.confirmPasswordRequiredError' | translate) : (isPasswordMismatch ? ('auth.signUp.passwordMismatchError' | translate) : '')) : ''"
    >
      <input
        id="confirm-password"
        [type]="isConfirmPasswordVisible() ? 'text' : 'password'"
        formControlName="confirmPassword"
        [placeholder]="'auth.signUp.confirmPasswordPlaceholder' | translate"
        autocomplete="new-password"
        class="w-full h-12 pl-11 pr-11 rounded-xl border border-outline-variant/80 bg-surface-container-lowest text-on-surface placeholder:text-secondary focus:border-on-surface focus:outline-none transition-colors font-sans text-base"
      />
    </app-auth-form-field>

    <!-- Terms Agreement Checkbox -->
    <div class="flex items-start pt-1">
      <label class="flex items-start gap-2.5 cursor-pointer select-none">
        <input
          type="checkbox"
          formControlName="termsAccepted"
          class="w-4 h-4 mt-0.5 rounded border-outline-variant text-on-surface focus:ring-0 focus:ring-offset-0 bg-surface-container-lowest transition-colors cursor-pointer shrink-0 accent-[#111111] dark:accent-primary"
        />
        <span class="font-sans text-[13px] sm:text-sm text-secondary hover:text-on-surface transition-colors leading-snug">
          {{ 'auth.signUp.termsAgreement' | translate }}
        </span>
      </label>
    </div>

    <!-- Primary CTA Capsule Button -->
    <div class="pt-2">
      <button
        type="submit"
        [disabled]="isLoading() || signUpForm.invalid || !isPasswordValid || isPasswordMismatch"
        class="w-full h-12 sm:h-[50px] rounded-full bg-[#111111] hover:bg-primary-container text-surface-container-lowest font-sans text-base font-medium flex items-center justify-center gap-2.5 transition-all duration-150 active:scale-[0.99] cursor-pointer shadow-none disabled:opacity-50 group"
      >
        <span>{{ isLoading() ? ('auth.signUp.sendingCode' | translate) : ('auth.signUp.createFreeAccount' | translate) }}</span>
        <span class="transition-transform duration-150 group-hover:translate-x-0.5">→</span>
      </button>
    </div>
  </form>

  <!-- Alternate Flow Link -->
  <div class="text-center pt-6 border-t border-outline-variant/80 mt-8">
    <p class="font-sans text-[13px] sm:text-sm text-secondary">
      {{ 'auth.signUp.alreadyHaveAccount' | translate }}
      <a routerLink="/sign-in" class="font-medium text-on-surface hover:text-primary transition-colors underline-offset-4 hover:underline ml-1">
        {{ 'auth.signUp.signIn' | translate }}
      </a>
    </p>
  </div>
</app-auth-card>

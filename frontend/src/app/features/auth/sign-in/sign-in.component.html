<app-auth-card>
  <!-- Brand Header -->
  <app-auth-header
    [title]="'auth.signIn.welcomeBack' | translate"
    [subtitle]="'auth.signIn.subtitle' | translate"
    [showLogo]="false"
  />

  <!-- Error Banner -->
  @if (errorMessage()) {
    <app-auth-notice-banner type="error" [message]="errorMessage()" />
  }

  <!-- Info Banner -->
  @if (infoMessage()) {
    <app-auth-notice-banner type="info" [message]="infoMessage()" />
  }

  <!-- Social Auth Cluster (Google Only) -->
  <app-social-auth
    [googleButtonText]="'auth.signIn.googleLogin' | translate"
    [dividerText]="'auth.signIn.orContinueWithEmail' | translate"
    [disabled]="isLoading()"
    (googleClick)="signInWithGoogle()"
  />

  <!-- Credentials Form -->
  <form [formGroup]="signInForm" (ngSubmit)="signIn()" class="space-y-5">
    <!-- Email Input Group -->
    <app-auth-form-field
      [label]="'auth.signIn.workEmailLabel' | translate"
      forId="work-email"
      [hint]="'auth.signIn.institutionalPreferred' | translate"
      prefixIcon="alternate_email"
      [errorMessage]="signInForm.get('email')?.touched && signInForm.get('email')?.errors ? (signInForm.get('email')?.errors?.['required'] ? ('auth.signIn.emailRequiredError' | translate) : ('auth.signIn.emailInvalidError' | translate)) : ''"
    >
      <input
        id="work-email"
        type="email"
        formControlName="email"
        [placeholder]="'auth.signIn.emailPlaceholder' | translate"
        autocomplete="email"
        class="w-full h-12 pl-11 pr-4 rounded-xl border border-outline-variant/80 bg-surface-container-lowest text-on-surface placeholder:text-secondary focus:border-on-surface focus:outline-none transition-colors font-sans text-base"
      />
    </app-auth-form-field>

    <!-- Password Input Group -->
    <app-auth-form-field
      [label]="'auth.signIn.passwordLabel' | translate"
      forId="password"
      [linkText]="'auth.signIn.forgotPasswordLink' | translate"
      linkRoute="/forgot-password"
      prefixIcon="lock_open"
      [suffixIcon]="isPasswordVisible() ? 'visibility_off' : 'visibility'"
      [showSuffix]="true"
      [suffixAriaLabel]="'auth.signIn.togglePasswordVisibility' | translate"
      (suffixClick)="togglePasswordVisibility()"
      [errorMessage]="signInForm.get('password')?.touched && signInForm.get('password')?.errors?.['required'] ? ('auth.signIn.passwordRequiredError' | translate) : ''"
    >
      <input
        id="password"
        [type]="isPasswordVisible() ? 'text' : 'password'"
        formControlName="password"
        [placeholder]="'auth.signIn.passwordPlaceholder' | translate"
        autocomplete="current-password"
        class="w-full h-12 pl-11 pr-11 rounded-xl border border-outline-variant/80 bg-surface-container-lowest text-on-surface placeholder:text-secondary focus:border-on-surface focus:outline-none transition-colors font-sans text-base"
      />
    </app-auth-form-field>

    <!-- Remember Credentials Checkbox -->
    <div class="flex items-center pt-1">
      <label class="flex items-center gap-2.5 cursor-pointer select-none">
        <input
          type="checkbox"
          formControlName="rememberMe"
          class="w-4 h-4 rounded border-outline-variant text-on-surface bg-surface-container-lowest accent-[#111111] dark:accent-primary cursor-pointer focus:ring-0 focus:ring-offset-0 transition-colors"
        />
        <span class="font-sans text-[13px] sm:text-sm text-secondary hover:text-on-surface transition-colors">
          {{ 'auth.signIn.rememberCredentials' | translate }}
        </span>
      </label>
    </div>

    <!-- Primary CTA Capsule Button -->
    <div class="pt-2">
      <button
        type="submit"
        [disabled]="isLoading()"
        class="w-full h-12 sm:h-[50px] rounded-full bg-[#111111] hover:bg-primary-container text-surface-container-lowest font-sans text-base font-medium flex items-center justify-center gap-2.5 transition-all duration-150 active:scale-[0.99] cursor-pointer shadow-none disabled:opacity-50 group"
      >
        <span>{{ isLoading() ? ('auth.signIn.signingIn' | translate) : ('auth.signIn.signInToWorkspace' | translate) }}</span>
        <span class="transition-transform duration-150 group-hover:translate-x-0.5">→</span>
      </button>
    </div>
  </form>

  <!-- Alternate Flow Link -->
  <div class="text-center pt-6 border-t border-outline-variant/80 mt-8">
    <p class="font-sans text-[13px] sm:text-sm text-secondary">
      {{ 'auth.signIn.noAccountPrompt' | translate }}
      <a routerLink="/sign-up" class="font-medium text-on-surface hover:text-primary transition-colors underline-offset-4 hover:underline ml-1">
        {{ 'auth.signIn.signUpFree' | translate }}
      </a>
    </p>
  </div>
</app-auth-card>

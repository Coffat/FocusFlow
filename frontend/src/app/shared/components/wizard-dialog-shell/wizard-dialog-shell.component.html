@if (open()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-[#111111]/40 backdrop-blur-md overflow-y-auto"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title()"
    data-testid="wizard-dialog-backdrop"
    (click)="onBackdropClick($event)"
  >
    <div
      class="w-full bg-[#FFFFFF] border border-[#DCDCDC] rounded-xl shadow-[0_24px_48px_-12px_rgba(17,17,17,0.12)] flex flex-col h-[min(92vh,800px)] lg:h-[min(86vh,800px)] max-h-[92vh] overflow-hidden my-auto"
      [ngClass]="maxWidthClass()"
      data-testid="wizard-dialog-container"
    >
      <!-- TOP HEADER BAR -->
      <header class="px-5 sm:px-6 py-3.5 border-b border-[#DCDCDC] bg-[#FFFFFF] flex flex-wrap sm:flex-nowrap items-center justify-between gap-3 shrink-0">
        <!-- Left: FocusFlow Logo + Title -->
        <div class="flex items-center gap-2.5 min-w-0 shrink-0">
          <img
            src="assets/logo.svg"
            alt="FocusFlow"
            class="w-7 h-7 object-contain shrink-0"
          />
          <div class="min-w-0">
            <span class="block text-sm font-semibold text-[#111111] tracking-tight truncate">
              {{ title() }}
            </span>
          </div>
        </div>

        <!-- Center: Interactive 4-Step Stepper -->
        <nav
          aria-label="Tiến trình khởi tạo lộ trình"
          class="flex items-center gap-1.5 sm:gap-2 overflow-x-auto py-0.5 min-w-0"
        >
          @for (item of steps; track item.step) {
            <button
              type="button"
              (click)="onStepClick(item.step)"
              [attr.data-testid]="'wizard-step-btn-' + item.step"
              [attr.aria-current]="activeStep() === item.step ? 'step' : null"
              class="px-3 py-1 rounded-full text-xs font-medium transition-colors flex items-center gap-1.5 cursor-pointer shrink-0 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#246B4A] focus-visible:ring-offset-1"
              [class.bg-[#EBF3EE]]="item.step < activeStep()"
              [class.text-[#246B4A]]="item.step < activeStep()"
              [class.font-semibold]="item.step <= activeStep()"
              [class.bg-[#246B4A]]="item.step === activeStep()"
              [class.text-white]="item.step === activeStep()"
              [class.bg-[#F3F3F1]]="item.step > activeStep()"
              [class.text-[#8E8E8A]]="item.step > activeStep()"
            >
              @if (item.step < activeStep()) {
                <span class="font-mono text-[10px] font-bold" aria-hidden="true">✓</span>
              }
              <span>{{ item.label }}</span>
            </button>
          }
        </nav>

        <!-- Right: Close X -->
        <div class="flex items-center shrink-0">
          <button
            type="button"
            (click)="onClose()"
            aria-label="Đóng hộp thoại"
            data-testid="wizard-close-btn"
            class="w-8 h-8 rounded-full text-[#555555] hover:text-[#111111] hover:bg-[#F3F3F1] flex items-center justify-center transition-colors cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#246B4A]"
          >
            <span class="material-symbols-outlined text-[18px]" aria-hidden="true">close</span>
          </button>
        </div>
      </header>

      <!-- ACCESSIBLE ERROR SUMMARY BANNER -->
      @if (errorMessage(); as err) {
        <div
          role="alert"
          aria-live="assertive"
          data-testid="wizard-error-banner"
          class="bg-[#FBEBEB] border-b border-[#B91C1C]/30 text-[#B91C1C] px-6 py-3.5 flex items-start gap-3 text-xs shrink-0"
        >
          <span class="material-symbols-outlined text-[18px] shrink-0 mt-0.5" aria-hidden="true">error</span>
          <div class="flex-1 leading-relaxed">
            <span class="font-semibold block">Không thể hoàn tất thao tác máy chủ:</span>
            <span>{{ err }}</span>
          </div>
        </div>
      }

      <!-- MAIN FLEX BODY SLOT -->
      <div class="flex-1 min-h-0 flex flex-col overflow-hidden">
        <ng-content />
      </div>

      <!-- OPTIONAL FOOTER SLOT -->
      <ng-content select="[wizardFooter]" />
    </div>
  </div>
}

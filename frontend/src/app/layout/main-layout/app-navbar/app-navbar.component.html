<header class="app-navbar h-16 border-b border-neutral-200/70 bg-white/90 backdrop-blur-md px-4 sm:px-6 lg:px-8 flex items-center justify-between sticky top-0 z-40 select-none">
  <!-- Left: Brand Logo & Title -->
  <div class="flex items-center gap-3 shrink-0">
    <a routerLink="/dashboard" class="flex items-center gap-2.5 no-underline group" aria-label="FocusFlow Home">
      <svg class="w-8 h-8 shrink-0 transition-transform group-hover:scale-105" fill="none" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
        <circle cx="18" cy="18" fill="#10B981" r="4"></circle>
        <path d="M6 18C6 11.3726 11.3726 6 18 6C23 6 27.5 9 29.5 13.5C28 12.5 25.5 12 23 13C19.5 14.5 17 18 13.5 21.5C11 24 8 23 6 18Z" fill="#0F172A"></path>
        <path d="M30 18C30 24.6274 24.6274 30 18 30C13 30 8.5 27 6.5 22.5C8 23.5 10.5 24 13 23C16.5 21.5 19 18 22.5 14.5C25 12 28 13 30 18Z" fill="url(#emerald-grad-nav)"></path>
        <defs>
          <linearGradient id="emerald-grad-nav" x1="18" y1="14" x2="30" y2="30" gradientUnits="userSpaceOnUse">
            <stop stop-color="#246B4A"></stop>
            <stop offset="1" stop-color="#10B981"></stop>
          </linearGradient>
        </defs>
      </svg>
      <div>
        <div class="flex items-center text-lg font-bold tracking-tight leading-none brand-title">
          <span class="text-neutral-900">Focus</span><span class="text-emerald-700">Flow</span>
        </div>
        <span class="text-[10px] text-neutral-400 font-medium tracking-wide uppercase leading-tight block mt-0.5">Plan Smarter • Do Better</span>
      </div>
    </a>
  </div>

  <!-- Center: Primary Navigation Links -->
  <nav class="hidden md:flex items-center gap-1.5 text-xs font-medium" aria-label="Điều hướng chính">
    @for (item of navItems; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="bg-neutral-900 text-white font-semibold shadow-xs"
        [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }"
        class="text-neutral-600 hover:text-neutral-900 hover:bg-neutral-100 px-3.5 py-1.5 rounded-full transition no-underline"
      >
        {{ item.label }}
      </a>
    }
  </nav>

  <!-- Right: Utility Cluster -->
  <div class="flex items-center gap-2.5 sm:gap-3">
    <!-- Quick Action "Vào học" (SRL Performance phase entry) -->
    <a
      routerLink="/workspace"
      class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-emerald-800 text-white text-xs font-semibold hover:bg-emerald-900 transition-all shadow-xs no-underline"
      title="Bắt đầu phiên học với Pomodoro Timer"
    >
      <span class="material-symbols-outlined text-[15px]" aria-hidden="true">play_arrow</span>
      <span class="hidden sm:inline">Vào học</span>
    </a>

    <!-- Quick Search Pill (⌘K) -->
    <button
      type="button"
      (click)="onSearchTrigger()"
      class="hidden lg:flex items-center gap-2 bg-neutral-100 hover:bg-neutral-200/80 text-neutral-500 px-3 py-1.5 rounded-full text-xs border border-neutral-200/60 transition cursor-pointer"
      title="Tìm kiếm nhanh (⌘K)"
    >
      <span class="material-symbols-outlined text-[15px]" aria-hidden="true">search</span>
      <span>Tìm nhanh</span>
      <kbd class="font-mono text-[10px] bg-white text-neutral-600 px-1.5 py-0.5 rounded border border-neutral-200/80 shadow-2xs">⌘K</kbd>
    </button>

    <!-- Notification Bell -->
    <button
      type="button"
      aria-label="Thông báo"
      class="relative p-2 text-neutral-600 hover:text-neutral-900 hover:bg-neutral-100 rounded-full transition cursor-pointer"
      title="Thông báo"
    >
      <span class="material-symbols-outlined text-[20px]" aria-hidden="true">notifications</span>
      <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-emerald-500 rounded-full ring-2 ring-white"></span>
    </button>

    <!-- User Profile Pill -->
    <a
      routerLink="/settings"
      class="flex items-center gap-2.5 pl-1.5 pr-3 py-1 rounded-full border border-neutral-200/80 bg-neutral-50/70 hover:bg-white hover:border-neutral-300 transition group no-underline"
      title="Hồ sơ người dùng & Cài đặt"
    >
      <div class="w-7 h-7 rounded-full bg-emerald-100 text-emerald-900 border border-emerald-300/60 flex items-center justify-center font-bold text-xs shrink-0">
        {{ userInitials() }}
      </div>
      <div class="hidden xl:block text-left leading-none">
        <div class="text-xs font-semibold text-neutral-900 truncate max-w-[120px]">
          {{ userDisplayName() }}
        </div>
        <div class="text-[10px] text-neutral-400 font-mono mt-0.5">
          {{ userSubtitle() }}
        </div>
      </div>
    </a>
  </div>
</header>

<div class="min-h-screen flex flex-col bg-[var(--background)] text-[var(--foreground)]">
  <!-- Minimalist Notion-style Header -->
  <header class="border-b border-[var(--border)] bg-[var(--card)] px-6 py-3 flex items-center justify-between sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <a routerLink="/dashboard" class="flex items-center gap-2.5 no-underline text-[var(--foreground)]">
        <div class="w-8 h-8 rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)] flex items-center justify-center font-bold text-sm tracking-tight shadow-xs">
          FF
        </div>
        <span class="font-semibold text-base tracking-tight">FocusFlow</span>
      </a>
      <span class="text-xs px-2 py-0.5 rounded-full bg-[var(--muted)] text-[var(--muted-foreground)] font-mono">v1.0</span>
    </div>

    <nav class="flex items-center gap-1 text-sm font-medium">
      <a routerLink="/dashboard" routerLinkActive="bg-[var(--accent)] text-[var(--accent-foreground)]" class="px-3 py-1.5 rounded-md hover:bg-[var(--muted)] transition-colors">Tổng quan</a>
      <a routerLink="/roadmaps" routerLinkActive="bg-[var(--accent)] text-[var(--accent-foreground)]" class="px-3 py-1.5 rounded-md hover:bg-[var(--muted)] transition-colors">Lộ trình</a>
      <a routerLink="/schedule" routerLinkActive="bg-[var(--accent)] text-[var(--accent-foreground)]" class="px-3 py-1.5 rounded-md hover:bg-[var(--muted)] transition-colors">Lịch học</a>
      <a routerLink="/tasks" routerLinkActive="bg-[var(--accent)] text-[var(--accent-foreground)]" class="px-3 py-1.5 rounded-md hover:bg-[var(--muted)] transition-colors">Công việc</a>
      <a routerLink="/workspace" routerLinkActive="bg-[var(--accent)] text-[var(--accent-foreground)]" class="px-3 py-1.5 rounded-md hover:bg-[var(--muted)] transition-colors font-semibold text-[var(--primary)]">Phòng học (Pomodoro)</a>
      <a routerLink="/analytics" routerLinkActive="bg-[var(--accent)] text-[var(--accent-foreground)]" class="px-3 py-1.5 rounded-md hover:bg-[var(--muted)] transition-colors">Báo cáo KPI</a>
    </nav>

    <div class="flex items-center gap-3">
      <a routerLink="/settings" routerLinkActive="bg-[var(--muted)] text-[var(--foreground)]" class="p-2 rounded-md hover:bg-[var(--muted)] text-[var(--muted-foreground)] hover:text-[var(--foreground)] transition-colors" title="Cài đặt">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </a>
      <a routerLink="/auth/login" class="w-7 h-7 rounded-full bg-[var(--primary)] text-[var(--primary-foreground)] flex items-center justify-center text-xs font-semibold hover:opacity-90 transition-opacity" title="Tài khoản">
        U
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col">
    <router-outlet />
  </main>
</div>
